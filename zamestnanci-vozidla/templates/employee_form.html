{% extends 'base.html' %}
{% block title %}{{ 'Upravit zaměstnance' if employee.id else 'Nový zaměstnanec' }}{% endblock %}
{% block content %}
<div class="row justify-content-center"><div class="col-12 col-lg-8"><div class="card p-3 p-lg-4">
<h1 class="h4 mb-3">{{ 'Upravit zaměstnance' if employee.id else 'Nový zaměstnanec' }}</h1>
<form method="post"><div class="row g-3">
<div class="col-md-6"><label class="form-label">Jméno *</label><input class="form-control" name="first_name" value="{{ employee.first_name or '' }}" required></div>
<div class="col-md-6"><label class="form-label">Příjmení *</label><input class="form-control" name="last_name" value="{{ employee.last_name or '' }}" required></div>
<div class="col-md-6"><label class="form-label">Telefon</label><input class="form-control" name="phone" value="{{ employee.phone or '' }}"></div>
<div class="col-md-6"><label class="form-label">E-mail</label><input class="form-control" type="email" name="email" value="{{ employee.email or '' }}"></div>
<div class="col-md-4"><label class="form-label">Nárok na dovolenou / rok</label><input class="form-control" type="number" min="0" step="0.5" name="vacation_entitlement" value="{{ employee.vacation_entitlement if employee.vacation_entitlement is not none else 20 }}"></div>
<div class="col-12"><div class="form-check"><input class="form-check-input" type="checkbox" name="active" id="active" {% if employee.active is not false %}checked{% endif %}><label class="form-check-label" for="active">Aktivní zaměstnanec</label></div></div>
<div class="col-12"><label class="form-label">Poznámka</label><textarea class="form-control" name="note" rows="3">{{ employee.note or '' }}</textarea></div>
<div class="col-12 d-flex gap-2"><button class="btn btn-primary">Uložit</button><a class="btn btn-outline-secondary" href="{{ url_for('employee_detail', employee_id=employee.id) if employee.id else url_for('employees') }}">Zrušit</a></div>
</div></form></div></div></div>
{% endblock %}
