{% extends 'base.html' %}
{% block title %}Nová událost{% endblock %}
{% block content %}
<div class="row justify-content-center"><div class="col-12 col-lg-7"><div class="card p-3 p-lg-4"><h1 class="h4 mb-1">Nová událost</h1><div class="text-muted mb-3">{{ employee.full_name }}</div><form method="post"><div class="row g-3">
<div class="col-12"><label class="form-label">Typ *</label><select class="form-select" name="absence_type" required>{% for key,label in absence_types.items() %}<option value="{{ key }}">{{ label }}</option>{% endfor %}</select></div>
<div class="col-md-6"><label class="form-label">Datum od *</label><input class="form-control" type="date" name="start_date" required value="{{ request.form.get('start_date','') }}"></div>
<div class="col-md-6"><label class="form-label">Datum do *</label><input class="form-control" type="date" name="end_date" required value="{{ request.form.get('end_date','') }}"></div>
<div class="col-md-6"><label class="form-label">Čas od <span class="text-muted">(volitelně)</span></label><input class="form-control" type="time" name="start_time" value="{{ request.form.get('start_time','') }}"></div>
<div class="col-md-6"><label class="form-label">Čas do <span class="text-muted">(volitelně)</span></label><input class="form-control" type="time" name="end_time" value="{{ request.form.get('end_time','') }}"></div>
<div class="col-12"><label class="form-label">Poznámka</label><textarea class="form-control" name="note" rows="3">{{ request.form.get('note','') }}</textarea></div>
<div class="col-12 d-flex gap-2"><button class="btn btn-primary">Uložit do kalendáře</button><a class="btn btn-outline-secondary" href="{{ url_for('employee_detail', employee_id=employee.id) }}">Zrušit</a></div>
</div></form></div></div></div>
{% endblock %}
