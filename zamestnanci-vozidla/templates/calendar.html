{% extends 'base.html' %}
{% block title %}Kalendář zaměstnanců{% endblock %}
{% block head %}<script src="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.19/index.global.min.js"></script><script src="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.19/locales/cs.global.min.js"></script>{% endblock %}
{% block content %}
<div class="d-flex justify-content-between align-items-center page-header mb-3"><div><h1 class="page-title h3">Kalendář zaměstnanců</h1><div class="text-muted">Dovolená, lékař, nemoc a další nepřítomnosti</div></div></div>
<div class="card p-3"><div class="row g-2 align-items-end mb-3"><div class="col-12 col-md-5 col-lg-4"><label class="form-label">Zaměstnanec</label><select id="employeeFilter" class="form-select"><option value="">Všichni zaměstnanci</option>{% for e in employees %}<option value="{{ e.id }}">{{ e.full_name }}</option>{% endfor %}</select></div><div class="col-12 col-md-auto"><a class="btn btn-outline-primary" href="{{ url_for('employees') }}">Přidat událost přes zaměstnance</a></div></div><div id="calendar"></div></div>
{% endblock %}
{% block scripts %}<script>
document.addEventListener('DOMContentLoaded', function(){
  const filter=document.getElementById('employeeFilter');
  const calendar=new FullCalendar.Calendar(document.getElementById('calendar'),{
    locale:'cs',firstDay:1,height:'auto',initialView:'dayGridMonth',
    headerToolbar:{left:'dayGridMonth,timeGridWeek,timeGridDay',center:'title',right:'prev,today,next'},
    buttonText:{today:'Dnes',month:'Měsíc',week:'Týden',day:'Den'},
    events:{url:'{{ url_for("api_absences") }}',extraParams:()=>({employee_id:filter.value})},
    eventDidMount:function(info){const note=info.event.extendedProps.note;if(note){info.el.title=note;}},
    eventClick:function(info){if(info.event.extendedProps.note){alert(info.event.title+'\n\n'+info.event.extendedProps.note);}}
  });
  calendar.render();
  filter.addEventListener('change',()=>calendar.refetchEvents());
});
</script>{% endblock %}
